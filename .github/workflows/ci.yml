name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax and imports
        run: |
          python3 -m compileall -q relay.py chatgpt_relay tests
          python3 relay.py --help >/dev/null
          python3 - <<'PY'
          from chatgpt_relay import common, github, runner, server, state, transport, cli
          assert common.VERSION == "1.2.2"
          assert hasattr(server, "time")
          assert github.GH_READ_TIMEOUT <= 15
          assert github.GH_WRITE_TIMEOUT <= 20
          assert github.GH_RETRY_ATTEMPTS >= 5
          PY

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n self-test.sh

      - name: JSON examples
        run: |
          python3 -m json.tool examples/job-ping.json >/dev/null
          python3 -m json.tool examples/job-shell.json >/dev/null

      - name: Reliability test suite
        run: python3 -m unittest -v tests/test_reliability.py

      - name: Installed-layout smoke test
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/app"
          cp relay.py "$tmp/app/"
          cp -a chatgpt_relay "$tmp/app/"
          python3 "$tmp/app/relay.py" --help >/dev/null
          python3 "$tmp/app/relay.py" --version 2>/dev/null && exit 1 || true

      - name: Installer help smoke test
        run: bash install.sh --help >/dev/null
